<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birds Punctuate the Days | Joyce Clement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <header class="top-band">
            <span class="site-mark">FIELD NOTES <span aria-hidden="true">✦</span> POETRY</span>
        </header>

        <section class="title-section">
            <p class="eyebrow">A POEM BY JOYCE CLEMENT</p>
            <h1>Birds Punctuate the Days</h1>
            <p class="author">Joyce Clement</p>
            <div class="title-rule" aria-hidden="true"></div>
        </section>

        <main class="main-content">
            <figure class="image-box">
                <img src="img/Haiku_image.jpg" alt="A blue speckled egg resting in a grassy nest">
                <figcaption>A small wonder of the natural world</figcaption>
            </figure>

            <section class="haiku-box" aria-labelledby="poem-heading">
                <p class="section-label">THE HAIKU</p>
                <h2 id="poem-heading">A summer remembered</h2>
                <div class="poem">
                    <p>Period</p>
                    <p>One blue egg all summer long</p>
                    <p>Now Gone</p>
                </div>
                <div class="poem-mark" aria-hidden="true">✦</div>
            </section>
        </main>

        <footer class="bottom-band">
            <span>A quiet moment in nature</span>
            <span class="footer-author">Birds Punctuate the Days · Joyce Clement</span>
        </footer>
    </div>
</body>
</html>
